name: BrandShield CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_name:
        description: "Brand name to screen"
        required: false
        default: "Lumora"

jobs:
  verify-cli-and-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run BrandShield Action (Job Summary Demo)
        id: brand
        uses: zColdWater/brandshield-cli@v1
        with:
          name: ${{ github.event.inputs.candidate_name || 'Lumora' }}
          tlds: "com,io,ai,co,app,dev"
          min-score: "70"
          fail-on-trademark: "true"
          post-summary: "true"
          out-file: "brandshield-report.json"

      - name: Print Outputs
        run: |
          echo "Score=${{ steps.brand.outputs.score }}/100 Verdict=${{ steps.brand.outputs.verdict }} TM=${{ steps.brand.outputs.tm-risk }}"
          test -f brandshield-report.json
